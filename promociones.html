<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jessica Boutique - Promociones</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- La barra lateral se carga dinámicamente con sidebar.js -->
    
    <!-- Main Content -->
    <main class="main-content">
        <!-- Top Bar -->
        <header class="top-bar">
            <div class="page-title">
                <h1>Promociones</h1>
                <p>Gestiona tus promociones y descuentos</p>
            </div>
            
            <div class="top-bar-actions">
                <a href="#" class="btn-notification" id="notificationLink">
                    <i class="fas fa-bell"></i>
                    <span class="notification-badge">3</span>
                </a>
                <div class="current-date">
                    <i class="fas fa-calendar"></i>
                    <span id="currentDate"></span>
                </div>
            </div>
        </header>

        <!-- Promociones Content -->
        <div class="content-sections">
            <section class="content-section active">
                <div class="section-header">
                    <div class="header-left">
                        <h2><i class="fas fa-percentage"></i> Promociones</h2>
                        <p>Gestiona tus promociones y descuentos</p>
                    </div>
                    <div class="header-actions">
                        <button class="btn-primary" id="newPromotionBtn">
                            <i class="fas fa-plus"></i> Nueva Promoción
                        </button>
                    </div>
                </div>

                <!-- Promotion Form -->
                <div class="form-container" id="promotionFormContainer" style="display: none;">
                    <form id="promotionForm">
                        <div class="form-section">
                            <h3><i class="fas fa-info-circle"></i> Información de la Promoción</h3>
                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="promotionName">Nombre *</label>
                                    <input type="text" id="promotionName" required 
                                           placeholder="Nombre de la promoción">
                                </div>
                                <div class="form-group">
                                    <label for="promotionType">Tipo *</label>
                                    <select id="promotionType" required>
                                        <option value="">Selecciona un tipo</option>
                                        <option value="descuento">Descuento</option>
                                        <option value="2x1">2x1</option>
                                        <option value="3x2">3x2</option>
                                        <option value="envio">Envío Gratis</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="promotionValue">Valor *</label>
                                    <input type="number" id="promotionValue" required 
                                           placeholder="Ej: 10 para 10% de descuento">
                                </div>
                                <div class="form-group">
                                    <label for="promotionStart">Fecha Inicio *</label>
                                    <input type="date" id="promotionStart" required>
                                </div>
                                <div class="form-group">
                                    <label for="promotionEnd">Fecha Fin *</label>
                                    <input type="date" id="promotionEnd" required>
                                </div>
                                <div class="form-group">
                                    <label for="promotionProducts">Productos Aplicables</label>
                                    <textarea id="promotionProducts" rows="2" 
                                              placeholder="IDs de productos separados por comas"></textarea>
                                </div>
                                <div class="form-group">
                                    <label for="promotionDescription">Descripción</label>
                                    <textarea id="promotionDescription" rows="2"></textarea>
                                </div>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="button" class="btn-secondary" id="cancelPromotion">
                                Cancelar
                            </button>
                            <button type="submit" class="btn-primary">
                                <i class="fas fa-save"></i> Guardar Promoción
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Promotions List -->
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Tipo</th>
                                <th>Valor</th>
                                <th>Vigencia</th>
                                <th>Productos</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="promotionsTable">
                            <!-- Las promociones se cargarán aquí -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <!-- Modales -->
    <div class="modal-overlay" id="modalOverlay"></div>

    <!-- Confirmation Modal -->
    <div class="modal" id="confirmationModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="confirmTitle"></h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <p id="confirmMessage"></p>
                <div class="modal-actions">
                    <button class="btn-secondary" id="cancelConfirm">Cancelar</button>
                    <button class="btn-primary" id="confirmAction">Confirmar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="sidebar.js"></script>
    <script src="script.js"></script>
</body>
</html>
