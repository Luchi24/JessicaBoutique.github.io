<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Ventas | Jessica Boutique</title>
    <link rel="stylesheet" href="style/main.css">
    <style>
        /* Estilos específicos para la página de ventas */
        .grid-ventas {
            display: grid;
            grid-template-columns: 2fr 1fr; /* Una columna para productos y otra para el carrito */
            gap: 20px;
        }
        #lista-productos-busqueda {
            list-style: none;
            padding: 0;
            border: 1px solid #ddd;
            max-height: 400px;
            overflow-y: auto;
        }
        #lista-productos-busqueda li {
            padding: 10px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #lista-productos-busqueda li:hover {
            background-color: #f5f5f5;
        }
        .carrito-resumen {
            padding: 20px;
            border: 1px solid #ff69b4;
            background-color: #fff0f5; /* Color rosa claro */
            border-radius: 8px;
        }
        .carrito-resumen h3 {
            color: #ff69b4;
        }
        #total-final {
            font-size: 1.8em;
            font-weight: bold;
            margin: 15px 0;
            border-top: 1px solid #ccc;
            padding-top: 10px;
        }
        #tabla-carrito th, #tabla-carrito td {
            text-align: left;
            padding: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="grid-ventas">
            
            <section class="card">
                <h2>🔎 Buscar y Agregar Productos</h2>
                <input type="text" id="input-busqueda" placeholder="Buscar producto por nombre..." onkeyup="buscarProductos()">
                
                <ul id="lista-productos-busqueda">
                    <li>Busca un producto para empezar...</li>
                </ul>
            </section>

            <section class="card carrito-resumen">
                <h2>🛒 Carrito de Compras</h2>
                
                <table id="tabla-carrito" width="100%">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th style="width: 50px;">Cant.</th>
                            <th style="width: 80px;">Precio</th>
                            <th style="width: 50px;"></th>
                        </tr>
                    </thead>
                    <tbody id="carrito-body">
                        </tbody>
                </table>
                
                <div id="total-final">
                    Total: S/ <span id="valor-total">0.00</span>
                </div>

                <button id="btn-procesar-venta" onclick="procesarVenta()" disabled>Procesar Venta</button>
                <button id="btn-cancelar-venta" class="btn-eliminar" onclick="cancelarVenta()">Cancelar Venta</button>
            </section>

        </div>

    </div>

    <script src="script/functions.js"></script> 
    <script>
        // --- Variables de Estado de Venta ---
        let carrito = [];
        let productosDisponibles = []; // Variable para guardar los productos del localStorage

        document.addEventListener('DOMContentLoaded', () => {
            // Inicializar productos disponibles desde localStorage (de 'functions.js')
            productosDisponibles = JSON.parse(localStorage.getItem('productos')) || [];
            
            // Cargar la lista inicial de productos para que se vean al inicio
            mostrarResultadosBusqueda(productosDisponibles);
            actualizarCarritoUI();
        });

        // --- Funciones de Búsqueda de Productos ---

        /**
         * Realiza la búsqueda de productos en tiempo real al escribir.
         */
        function buscarProductos() {
            const termino = document.getElementById('input-busqueda').value.toLowerCase();
            const resultados = productosDisponibles.filter(p => 
                p.nombre.toLowerCase().includes(termino) && p.stock > 0
            );
            mostrarResultadosBusqueda(resultados);
        }

        /**
         * Muestra la lista de resultados de la búsqueda.
         */
        function mostrarResultadosBusqueda(lista) {
            const ul = document.getElementById('lista-productos-busqueda');
            ul.innerHTML = '';

            if (lista.length === 0) {
                ul.innerHTML = '<li>No se encontraron productos disponibles o con stock.</li>';
                return;
            }

            lista.forEach(producto => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span>${producto.nombre} | Stock: **${producto.stock}** | Precio: S/ ${producto.precio.toFixed(2)}</span>
                    <button onclick="agregarAlCarrito(${producto.id})" 
                            ${producto.stock === 0 ? 'disabled' : ''}>Añadir</button>
                `;
                ul.appendChild(li);
            });
        }

        // --- Funciones del Carrito ---

        /**
         * Agrega un producto al carrito de ventas.
         * @param {number} id_producto ID del producto a añadir.
         */
        function agregarAlCarrito(id_producto) {
            const productoBase = productosDisponibles.find(p => p.id === id_producto);
            
            if (!productoBase || productoBase.stock <= 0) {
                alert('No hay stock disponible de este producto.');
                return;
            }

            // Verificar si ya está en el carrito
            const itemCarrito = carrito.find(item => item.id === id_producto);
            
            if (itemCarrito) {
                if (itemCarrito.cantidad < productoBase.stock) {
                    itemCarrito.cantidad += 1;
                } else {
                    alert('Has alcanzado el límite de stock disponible para este producto.');
                }
            } else {
                carrito.push({
                    id: id_producto,
                    nombre: productoBase.nombre,
                    precio: productoBase.precio,
                    cantidad: 1
                });
            }

            actualizarCarritoUI();
        }

        /**
         * Elimina un producto del carrito o reduce su cantidad.
         * @param {number} id_producto ID del producto a manipular.
         * @param {string} accion 'aumentar', 'reducir' o 'eliminar'.
         */
        function manipularCarrito(id_producto, accion) {
            const index = carrito.findIndex(item => item.id === id_producto);
            if (index === -1) return;
            
            const item = carrito[index];
            const productoBase = productosDisponibles.find(p => p.id === id_producto);

            if (accion === 'eliminar') {
                carrito.splice(index, 1);
            } else if (accion === 'reducir') {
                item.cantidad -= 1;
                if (item.cantidad <= 0) {
                    carrito.splice(index, 1);
                }
            } else if (accion === 'aumentar') {
                 if (item.cantidad < productoBase.stock) {
                    item.cantidad += 1;
                } else {
                    alert('Has alcanzado el límite de stock disponible para este producto.');
                }
            }

            actualizarCarritoUI();
        }

        /**
         * Actualiza la tabla del carrito y el total.
         */
        function actualizarCarritoUI() {
            const tbody = document.getElementById('carrito-body');
            const valorTotalSpan = document.getElementById('valor-total');
            const btnProcesar = document.getElementById('btn-procesar-venta');
            let total = 0;
            tbody.innerHTML = '';

            carrito.forEach(item => {
                const subtotal = item.precio * item.cantidad;
                total += subtotal;

                const fila = tbody.insertRow();
                fila.innerHTML = `
                    <td>${item.nombre}</td>
                    <td>
                        <button onclick="manipularCarrito(${item.id}, 'reducir')" style="padding: 2px 6px;">-</button>
                        ${item.cantidad}
                        <button onclick="manipularCarrito(${item.id}, 'aumentar')" style="padding: 2px 6px;">+</button>
                    </td>
                    <td>S/ ${subtotal.toFixed(2)}</td>
                    <td><button class="btn-eliminar" onclick="manipularCarrito(${item.id}, 'eliminar')" style="padding: 5px;">X</button></td>
                `;
            });

            valorTotalSpan.textContent = total.toFixed(2);
            btnProcesar.disabled = carrito.length === 0;

            // Al actualizar el carrito, también actualizamos la lista de búsqueda por si el stock cambió
            buscarProductos(); 
        }

        // --- Funciones de Transacción ---

        /**
         * Simula el procesamiento final de la venta: 
         * 1. Descuenta stock. 
         * 2. Registra la venta (simulado).
         */
        function procesarVenta() {
            if (carrito.length === 0) {
                alert('El carrito está vacío. Agregue productos para procesar la venta.');
                return;
            }

            const totalVenta = parseFloat(document.getElementById('valor-total').textContent);
            
            if (!confirm(`Confirmar venta por un total de S/ ${totalVenta.toFixed(2)}?`)) {
                return;
            }

            // 1. DESCONTAR STOCK (Modifica la variable global 'productos' de functions.js)
            let productosActualizados = JSON.parse(localStorage.getItem('productos')) || [];

            carrito.forEach(itemVendido => {
                const index = productosActualizados.findIndex(p => p.id === itemVendido.id);
                if (index !== -1) {
                    productosActualizados[index].stock -= itemVendido.cantidad;
                }
            });

            // 2. REGISTRAR VENTA (Simulado)
            // En un sistema real, aquí se guardaría en la tabla 'Ventas' y 'DetalleVenta'.
            // Para la simulación, solo guardamos un registro simple en localStorage.
            let ventas = JSON.parse(localStorage.getItem('ventas')) || [];
            ventas.push({
                id_venta: ventas.length + 1,
                fecha: new Date().toLocaleString(),
                total: totalVenta,
                detalle: carrito
            });
            
            // 3. GUARDAR LOS CAMBIOS
            localStorage.setItem('productos', JSON.stringify(productosActualizados)); // Actualiza el stock
            localStorage.setItem('ventas', JSON.stringify(ventas)); // Guarda el registro de venta

            alert(`✅ Venta procesada con éxito. Total: S/ ${totalVenta.toFixed(2)}. Inventario actualizado.`);
            
            // 4. Resetear la página de ventas
            cancelarVenta(); 
            // Vuelve a cargar los productos disponibles con el stock actualizado
            productosDisponibles = productosActualizados; 
        }

        /**
         * Cancela la venta actual y limpia el carrito.
         */
        function cancelarVenta() {
            carrito = [];
            document.getElementById('input-busqueda').value = '';
            actualizarCarritoUI();
            mostrarResultadosBusqueda(productosDisponibles); // Recargar la lista de búsqueda
        }
    </script>
    <script src="script/layout.js"></script>
</body>
</html>
