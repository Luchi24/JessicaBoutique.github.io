<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jessica Boutique | Ventas</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="navbar">
        <div class="logo">
            <i class="fas fa-store"></i>
            <h1>Jessica Boutique</h1>
        </div>
        <div class="nav-buttons">
            <a href="index.html" class="nav-btn"><i class="fas fa-home"></i> Inicio</a>
            <a href="inventario.html" class="nav-btn"><i class="fas fa-boxes"></i> Inventario</a>
            <a href="agregar-producto.html" class="nav-btn"><i class="fas fa-plus"></i> Agregar</a>
            <a href="ventas.html" class="nav-btn active"><i class="fas fa-shopping-cart"></i> Ventas</a>
        </div>
    </div>

    <div class="container">
        <div class="seccion-header">
            <h2><i class="fas fa-shopping-cart"></i> Nueva Venta</h2>
            <div style="display: flex; align-items: center; gap: 1rem;">
                <span class="badge">Venta #<span id="numero-venta">1</span></span>
                <span id="fecha-actual" style="color: #999;"></span>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem;">
            <div>
                <div style="background: white; padding: 1.5rem; border-radius: 10px; margin-bottom: 1.5rem;">
                    <h3 style="color: #e91e63; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
                        <i class="fas fa-user"></i> Cliente
                    </h3>
                    <input type="text" id="cliente-nombre" placeholder="Nombre del cliente" 
                           style="width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 6px;">
                </div>

                <div style="background: white; padding: 1.5rem; border-radius: 10px; margin-bottom: 1.5rem;">
                    <h3 style="color: #e91e63; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
                        <i class="fas fa-search"></i> Buscar Productos
                    </h3>
                    <div style="position: relative; margin-bottom: 1rem;">
                        <i class="fas fa-search" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #999;"></i>
                        <input type="text" id="buscar-producto" placeholder="Escribe para buscar..." 
                               style="width: 100%; padding: 0.8rem 1rem 0.8rem 2.5rem; border: 1px solid #ddd; border-radius: 6px;">
                    </div>
                    <div id="lista-productos" style="max-height: 300px; overflow-y: auto; border: 1px solid #eee; border-radius: 6px;">
                        <!-- Productos se cargarán aquí -->
                    </div>
                </div>

                <div style="background: white; padding: 1.5rem; border-radius: 10px;">
                    <h3 style="color: #e91e63; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
                        <i class="fas fa-shopping-cart"></i> Carrito
                    </h3>
                    <div id="carrito" style="min-height: 200px; max-height: 400px; overflow-y: auto;">
                        <!-- Productos del carrito se cargarán aquí -->
                    </div>
                </div>
            </div>

            <div>
                <div style="background: white; padding: 1.5rem; border-radius: 10px; margin-bottom: 1.5rem;">
                    <h3 style="color: #e91e63; margin-bottom: 1rem;">Resumen</h3>
                    <div style="display: grid; gap: 0.8rem;">
                        <div style="display: flex; justify-content: space-between;">
                            <span>Subtotal:</span>
                            <span id="subtotal">S/. 0.00</span>
                        </div>
                        <div style="display: flex; justify-content: space-between;">
                            <span>IGV (18%):</span>
                            <span id="igv">S/. 0.00</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: bold; padding-top: 0.8rem; border-top: 1px solid #eee;">
                            <span>Total:</span>
                            <span id="total" style="color: #e91e63;">S/. 0.00</span>
                        </div>
                    </div>
                </div>

                <div style="background: white; padding: 1.5rem; border-radius: 10px; margin-bottom: 1.5rem;">
                    <h3 style="color: #e91e63; margin-bottom: 1rem;">Pago</h3>
                    <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="radio" name="metodo-pago" value="efectivo" checked>
                            <span>Efectivo</span>
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="radio" name="metodo-pago" value="tarjeta">
                            <span>Tarjeta</span>
                        </label>
                    </div>
                    <div id="grupo-efectivo">
                        <label style="display: block; margin-bottom: 0.5rem;">Monto Recibido</label>
                        <input type="number" id="monto-recibido" placeholder="S/. 0.00" min="0" step="0.01"
                               style="width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 6px;">
                        <div id="vuelto" style="margin-top: 0.5rem; padding: 0.8rem; background: #e8f5e9; border-radius: 6px; display: none;">
                            <strong>Vuelto: <span id="vuelto-monto">S/. 0.00</span></strong>
                        </div>
                    </div>
                </div>

                <div style="display: flex; gap: 1rem;">
                    <button class="btn-secundario" onclick="cancelarVenta()" style="flex: 1;">Cancelar</button>
                    <button class="btn-principal" onclick="finalizarVenta()" style="flex: 1;">
                        <i class="fas fa-check"></i> Finalizar Venta
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="notificaciones"></div>

    <script src="js/main.js"></script>
    <script src="js/header.js"></script>
    <script src="js/agregar.js"></script>
</body>
</html>
