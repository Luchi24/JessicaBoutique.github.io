<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jessica Boutique | Sistema de Gestión</title>
    
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        pink: {
                            50: '#fdf2f8',
                            100: '#fce7f3',
                            200: '#fbcfe8',
                            300: '#f9a8d4',
                            400: '#f472b6',
                            500: '#ec4899',
                            600: '#db2777',
                            700: '#be185d',
                            800: '#9d174d',
                            900: '#831843',
                            950: '#500724',
                        },
                        rose: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            500: '#f43f5e',
                            600: '#e11d48',
                        }
                    },
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'slide-up': 'slideUp 0.3s ease-out',
                        'slide-down': 'slideDown 0.3s ease-out',
                        'pulse-glow': 'pulseGlow 2s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        slideDown: {
                            '0%': { transform: 'translateY(-20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 5px rgba(236, 72, 153, 0.3)' },
                            '50%': { boxShadow: '0 0 20px rgba(236, 72, 153, 0.6)' },
                        }
                    },
                    backgroundImage: {
                        'gradient-radial-pink': 'radial-gradient(circle at center, rgba(251, 207, 232, 0.4) 0%, rgba(252, 231, 243, 0.1) 70%)',
                        'gradient-navbar': 'linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(253, 242, 248, 0.98) 100%)',
                    }
                }
            },
            plugins: [],
        }
    </script>
    
    <link rel="preload" href="js/utils.js" as="script">
    <link rel="preload" href="components/header.html" as="fetch" crossorigin="anonymous">
    
    <meta name="description" content="Sistema de gestión de inventario para Jessica Boutique">
    <meta name="keywords" content="inventario, boutique, moda, gestión, stock">
    <meta name="author" content="Jessica Boutique">
    
    <meta property="og:title" content="Jessica Boutique | Sistema de Gestión">
    <meta property="og:description" content="Sistema profesional de gestión de inventario">
    <meta property="og:type" content="website">
    
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
    
    <style>
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        
        .loading-logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ec4899, #db2777);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .loading-text {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            color: #db2777;
            font-size: 1.1rem;
        }
        
        .js-loading * {
            animation-play-state: paused !important;
            transition: none !important;
        }
    </style>
</head>
<body class="font-inter bg-gradient-to-br from-pink-50 via-white to-rose-50 min-h-screen js-loading">
    
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-logo">
            <i data-lucide="shopping-bag" class="text-white w-10 h-10"></i>
        </div>
        <div class="loading-text">Cargando Jessica Boutique...</div>
    </div>
    
    <div id="app" class="min-h-screen flex flex-col opacity-0 transition-opacity duration-500">
        
        <header id="header-container" class="sticky top-0 z-50 bg-gradient-navbar backdrop-blur-md border-b border-pink-200/50 shadow-sm">
        </header>
        
        <main id="app-container" class="flex-grow container mx-auto px-4 py-6 md:py-8 lg:py-10 max-w-7xl">
            <div id="default-content" class="text-center py-20">
                <div class="w-24 h-24 bg-gradient-to-r from-pink-400 to-rose-500 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg">
                    <i data-lucide="shopping-bag" class="text-white w-12 h-12"></i>
                </div>
                <h1 class="text-3xl font-bold text-gray-800 mb-3">Bienvenida a Jessica Boutique</h1>
                <p class="text-gray-600 max-w-md mx-auto mb-8">Sistema de gestión de inventario profesional</p>
                <div class="animate-pulse-glow">
                    <div class="inline-flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-pink-500 to-rose-500 text-white rounded-xl font-semibold">
                        <i data-lucide="package" class="w-5 h-5"></i>
                        Cargando inventario...
                    </div>
                </div>
            </div>
        </main>
        
        <footer id="footer-container" class="bg-white/80 border-t border-pink-100">
        </footer>
        
        <div id="global-modal" class="fixed inset-0 z-[100] hidden">
            <div class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
            <div class="absolute inset-0 flex items-center justify-center p-4">
                <div id="modal-content" class="bg-white rounded-2xl shadow-2xl max-w-md w-full max-h-[90vh] overflow-y-auto animate-slide-up">
                </div>
            </div>
        </div>
        
        <div id="toast-container" class="fixed bottom-4 right-4 z-[90] space-y-3"></div>
        
        <div id="offline-indicator" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-red-500 text-white px-4 py-2 rounded-lg shadow-lg hidden z-[80]">
            <div class="flex items-center gap-2">
                <i data-lucide="wifi-off" class="w-4 h-4"></i>
                <span>Sin conexión a internet</span>
            </div>
        </div>
        
        <button id="back-to-top" class="fixed bottom-6 right-6 bg-gradient-to-r from-pink-500 to-rose-500 text-white p-3 rounded-full shadow-lg hover:shadow-xl transition-all duration-300 opacity-0 transform translate-y-10 z-40">
            <i data-lucide="chevron-up" class="w-5 h-5"></i>
        </button>
        
    </div>
    
    <script src="js/utils.js"></script>
    
    <script>
        async function loadComponent(componentId, componentPath) {
            try {
                const response = await fetch(componentPath);
                if (!response.ok) throw new Error('Componente no encontrado');
                const html = await response.text();
                document.getElementById(componentId).innerHTML = html;
                
                const scripts = document.getElementById(componentId).querySelectorAll('script');
                scripts.forEach(script => {
                    const newScript = document.createElement('script');
                    if (script.src) {
                        newScript.src = script.src;
                    } else {
                        newScript.textContent = script.textContent;
                    }
                    document.body.appendChild(newScript);
                });
            } catch (error) {
                console.warn(`Error cargando ${componentPath}:`, error);
                if (componentId === 'header-container') {
                    document.getElementById(componentId).innerHTML = `
                        <div class="container mx-auto px-4 py-4">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 bg-gradient-to-r from-pink-500 to-rose-500 rounded-xl flex items-center justify-center">
                                        <i data-lucide="shopping-bag" class="text-white w-5 h-5"></i>
                                    </div>
                                    <div>
                                        <h1 class="text-xl font-bold text-gray-800">Jessica Boutique</h1>
                                        <p class="text-xs text-gray-500">Gestión de Inventario</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }
        }
        
        document.addEventListener('DOMContentLoaded', async () => {
            setTimeout(() => {
                document.getElementById('loadingScreen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loadingScreen').style.display = 'none';
                    document.getElementById('app').style.opacity = '1';
                    document.body.classList.remove('js-loading');
                }, 500);
            }, 800);
            
            await Promise.all([
                loadComponent('header-container', 'components/header.html'),
                loadComponent('footer-container', 'components/footer.html')
            ]);
            
            if (window.lucide) {
                lucide.createIcons();
            }
            
            const hash = window.location.hash.substring(1) || 'inventario';
            if (typeof window.loadSection === 'function') {
                await window.loadSection(hash);
            } else {
                const navScript = document.createElement('script');
                navScript.src = 'js/navigation.js';
                navScript.onload = () => {
                    if (window.loadSection) window.loadSection(hash);
                };
                document.body.appendChild(navScript);
            }
            
            const scripts = [
                'js/app.js',
                'js/products.js',
                'js/categories.js',
                'js/inventory.js',
                'js/statistics.js',
                'js/config.js'
            ];
            
            scripts.forEach(src => {
                const script = document.createElement('script');
                script.src = src;
                script.async = true;
                document.body.appendChild(script);
            });
            
            initializeBasicFeatures();
        });
        
        function initializeBasicFeatures() {
            const backToTopBtn = document.getElementById('back-to-top');
            if (backToTopBtn) {
                window.addEventListener('scroll', () => {
                    if (window.scrollY > 300) {
                        backToTopBtn.classList.remove('opacity-0', 'translate-y-10');
                        backToTopBtn.classList.add('opacity-100', 'translate-y-0');
                    } else {
                        backToTopBtn.classList.remove('opacity-100', 'translate-y-0');
                        backToTopBtn.classList.add('opacity-0', 'translate-y-10');
                    }
                });
                
                backToTopBtn.addEventListener('click', () => {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            }
            
            window.addEventListener('online', () => {
                document.getElementById('offline-indicator').classList.add('hidden');
                showToast('Conexión restablecida', 'success');
            });
            
            window.addEventListener('offline', () => {
                document.getElementById('offline-indicator').classList.remove('hidden');
                showToast('Sin conexión a internet', 'warning');
            });
            
            window.showToast = function(message, type = 'info') {
                const toastContainer = document.getElementById('toast-container');
                const toastId = 'toast-' + Date.now();
                
                const colors = {
                    success: 'bg-green-500',
                    error: 'bg-red-500',
                    warning: 'bg-yellow-500',
                    info: 'bg-blue-500'
                };
                
                const icons = {
                    success: 'check-circle',
                    error: 'alert-circle',
                    warning: 'alert-triangle',
                    info: 'info'
                };
                
                const toast = document.createElement('div');
                toast.id = toastId;
                toast.className = `${colors[type] || colors.info} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 animate-slide-up`;
                toast.innerHTML = `
                    <i data-lucide="${icons[type] || 'info'}" class="w-5 h-5"></i>
                    <span>${message}</span>
                    <button onclick="document.getElementById('${toastId}').remove()" class="ml-auto">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                `;
                
                toastContainer.appendChild(toast);
                
                lucide.createIcons();
                
                setTimeout(() => {
                    if (document.getElementById(toastId)) {
                        toast.classList.add('opacity-0', 'transition-opacity', 'duration-300');
                        setTimeout(() => {
                            if (document.getElementById(toastId)) {
                                document.getElementById(toastId).remove();
                            }
                        }, 300);
                    }
                }, 5000);
            };
            
            window.showModal = function(content) {
                const modal = document.getElementById('global-modal');
                const modalContent = document.getElementById('modal-content');
                
                modalContent.innerHTML = content;
                modal.classList.remove('hidden');
                
                setTimeout(() => lucide.createIcons(), 100);
                
                modal.addEventListener('click', function(e) {
                    if (e.target === modal) {
                        closeModal();
                    }
                });
                
                document.addEventListener('keydown', function escHandler(e) {
                    if (e.key === 'Escape') {
                        closeModal();
                        document.removeEventListener('keydown', escHandler);
                    }
                });
            };
            
            window.closeModal = function() {
                const modal = document.getElementById('global-modal');
                modal.classList.add('hidden');
            };
        }
    </script>
    
    <script>
        if (typeof tailwind === 'undefined') {
            const style = document.createElement('style');
            style.textContent = `
                body { font-family: 'Inter', sans-serif; margin: 0; }
                .container { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }
            `;
            document.head.appendChild(style);
        }
        
        if (typeof lucide === 'undefined') {
            const script = document.createElement('script');
            script.src = 'https://unpkg.com/lucide@latest';
            script.onload = () => {
                if (window.lucide) {
                    lucide.createIcons();
                }
            };
            document.body.appendChild(script);
        }
    </script>
    
</body>
</html>
