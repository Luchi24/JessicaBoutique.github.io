<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jessica Boutique | Inicio</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- El sidebar se insertará automáticamente -->
    
    <div class="content-header">
        <h2><i class="fas fa-home"></i> Panel de Control</h2>
        <div class="header-actions">
            <span id="fecha-actual" style="color: #666;"></span>
            <button class="btn btn-secondary" onclick="actualizarDashboard()">
                <i class="fas fa-sync-alt"></i> Actualizar
            </button>
        </div>
    </div>

    <div class="grid grid-4">
        <div class="stat-card">
            <div class="stat-icon primary">
                <i class="fas fa-boxes"></i>
            </div>
            <div class="stat-value" id="total-productos">0</div>
            <div class="stat-label">Total Productos</div>
        </div>
        
        <div class="stat-card">
            <div class="stat-icon success">
                <i class="fas fa-shopping-cart"></i>
            </div>
            <div class="stat-value" id="ventas-hoy">0</div>
            <div class="stat-label">Ventas Hoy</div>
            <small id="monto-hoy" style="color: #666;">S/. 0.00</small>
        </div>
        
        <div class="stat-card">
            <div class="stat-icon warning">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <div class="stat-value" id="stock-bajo">0</div>
            <div class="stat-label">Stock Bajo</div>
            <small style="color: #666;">(<span id="alerta-stock">3</span> unidades)</small>
        </div>
        
        <div class="stat-card">
            <div class="stat-icon info">
                <i class="fas fa-money-bill-wave"></i>
            </div>
            <div class="stat-value" id="ganancias-hoy">S/. 0</div>
            <div class="stat-label">Ganancias Hoy</div>
        </div>
    </div>

    <div class="grid grid-2">
        <div class="card">
            <div class="card-header">
                <h3><i class="fas fa-chart-line"></i> Ventas de Hoy</h3>
                <select id="filtro-horas" onchange="actualizarGraficoHoy()" class="form-control" style="width: auto;">
                    <option value="horas">Por Horas</option>
                    <option value="productos">Por Productos</option>
                </select>
            </div>
            <div style="position: relative; height: 250px;">
                <canvas id="grafico-hoy"></canvas>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h3><i class="fas fa-fire"></i> Productos Más Vendidos</h3>
                <a href="reportes.html" class="btn btn-sm btn-secondary">
                    Ver Todos <i class="fas fa-arrow-right"></i>
                </a>
            </div>
            <div id="top-productos" style="max-height: 250px; overflow-y: auto;">
                <!-- Productos populares se cargarán aquí -->
            </div>
        </div>
    </div>

    <div class="grid grid-2">
        <div class="card">
            <div class="card-header">
                <h3><i class="fas fa-exclamation-circle"></i> Alertas del Sistema</h3>
                <span class="badge badge-danger" id="contador-alertas">0</span>
            </div>
            <div id="alertas-container" style="max-height: 200px; overflow-y: auto;">
                <!-- Alertas se cargarán aquí -->
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h3><i class="fas fa-history"></i> Actividad Reciente</h3>
                <a href="ventas.html" class="btn btn-sm btn-primary">
                    <i class="fas fa-plus"></i> Nueva Venta
                </a>
            </div>
            <div id="actividad-reciente" style="max-height: 200px; overflow-y: auto;">
                <!-- Actividad reciente se cargará aquí -->
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/header.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
