<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jessica Boutique | Inventario</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- El sidebar se insertará automáticamente -->
    
    <div class="content-header">
        <h2><i class="fas fa-boxes"></i> Inventario de Productos</h2>
        <div class="header-actions">
            <a href="agregar-producto.html" class="btn btn-primary">
                <i class="fas fa-plus"></i> Nuevo Producto
            </a>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h3><i class="fas fa-filter"></i> Filtros de Búsqueda</h3>
        </div>
        <div class="form-row">
            <div class="form-group">
                <div style="position: relative;">
                    <i class="fas fa-search" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #999;"></i>
                    <input type="text" id="buscar-producto" placeholder="Buscar productos..." class="form-control" style="padding-left: 2.5rem;">
                </div>
            </div>
            <div class="form-group">
                <select id="filtro-categoria" class="form-control">
                    <option value="">Todas las categorías</option>
                </select>
            </div>
        </div>
    </div>

    <div class="table-container">
        <table class="table">
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Talla/Color</th>
                    <th>Stock</th>
                    <th>Precio</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="lista-productos">
                <!-- Productos se cargarán aquí -->
            </tbody>
        </table>
    </div>

    <div class="grid grid-3" style="margin-top: 1.5rem;">
        <div class="stat-card">
            <div class="stat-value" id="contador-total">0</div>
            <div class="stat-label">Total Productos</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="contador-bajo" style="color: #ff9800;">0</div>
            <div class="stat-label">Stock Bajo</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="valor-total" style="color: #28a745;">S/. 0</div>
            <div class="stat-label">Valor Total</div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/header.js"></script>
    <script src="js/inventario.js"></script>
</body>
</html>
