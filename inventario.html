<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jessica Boutique | Inventario</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="navbar">
        <div class="logo">
            <i class="fas fa-store"></i>
            <h1>Jessica Boutique</h1>
        </div>
        <div class="nav-buttons">
            <a href="index.html" class="nav-btn"><i class="fas fa-home"></i> Inicio</a>
            <a href="inventario.html" class="nav-btn active"><i class="fas fa-boxes"></i> Inventario</a>
            <a href="agregar-producto.html" class="nav-btn"><i class="fas fa-plus"></i> Agregar</a>
            <a href="ventas.html" class="nav-btn"><i class="fas fa-shopping-cart"></i> Ventas</a>
        </div>
    </div>

    <div class="container">
        <div class="seccion-header">
            <h2><i class="fas fa-boxes"></i> Inventario</h2>
            <a href="agregar-producto.html" class="btn-principal">
                <i class="fas fa-plus"></i> Nuevo Producto
            </a>
        </div>

        <div style="margin-bottom: 1.5rem; display: flex; gap: 1rem;">
            <div style="flex: 1; position: relative;">
                <i class="fas fa-search" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #999;"></i>
                <input type="text" id="buscar-producto" placeholder="Buscar productos..." 
                       style="width: 100%; padding: 0.8rem 1rem 0.8rem 2.5rem; border: 1px solid #ddd; border-radius: 8px;">
            </div>
            <select id="filtro-categoria" style="padding: 0.8rem; border: 1px solid #ddd; border-radius: 8px;">
                <option value="">Todas las categorías</option>
            </select>
        </div>

        <div style="background: white; border-radius: 10px; overflow: hidden;">
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="background: #e91e63; color: white;">
                        <th style="padding: 1rem; text-align: left;">Producto</th>
                        <th style="padding: 1rem; text-align: left;">Categoría</th>
                        <th style="padding: 1rem; text-align: left;">Talla/Color</th>
                        <th style="padding: 1rem; text-align: left;">Stock</th>
                        <th style="padding: 1rem; text-align: left;">Precio</th>
                        <th style="padding: 1rem; text-align: left;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="lista-productos">
                    <!-- Productos se cargarán aquí -->
                </tbody>
            </table>
        </div>

        <div style="margin-top: 1.5rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
            <div style="background: white; padding: 1rem; border-radius: 8px; text-align: center;">
                <p style="color: #999; margin-bottom: 0.5rem;">Total Productos</p>
                <p style="font-size: 1.5rem; font-weight: bold; color: #e91e63;" id="contador-total">0</p>
            </div>
            <div style="background: white; padding: 1rem; border-radius: 8px; text-align: center;">
                <p style="color: #999; margin-bottom: 0.5rem;">Stock Bajo</p>
                <p style="font-size: 1.5rem; font-weight: bold; color: #ff9800;" id="contador-bajo">0</p>
            </div>
            <div style="background: white; padding: 1rem; border-radius: 8px; text-align: center;">
                <p style="color: #999; margin-bottom: 0.5rem;">Valor Total</p>
                <p style="font-size: 1.5rem; font-weight: bold; color: #4caf50;" id="valor-total">S/. 0</p>
            </div>
        </div>
    </div>

    <div id="modal-editar"></div>
    <div id="notificaciones"></div>

    <script src="js/main.js"></script>
    <script src="js/inventario.js"></script>
</body>
</html>
