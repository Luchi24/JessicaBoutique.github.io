<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jessica Boutique | Reportes</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="navbar">
        <div class="logo">
            <i class="fas fa-store"></i>
            <h1>Jessica Boutique</h1>
        </div>
        <div class="nav-buttons">
            <a href="index.html" class="nav-btn"><i class="fas fa-home"></i> Inicio</a>
            <a href="inventario.html" class="nav-btn"><i class="fas fa-boxes"></i> Inventario</a>
            <a href="agregar-producto.html" class="nav-btn"><i class="fas fa-plus"></i> Agregar</a>
            <a href="ventas.html" class="nav-btn"><i class="fas fa-shopping-cart"></i> Ventas</a>
            <a href="reportes.html" class="nav-btn active"><i class="fas fa-chart-line"></i> Reportes</a>
            <a href="gestion.html" class="nav-btn"><i class="fas fa-cog"></i> Configuración</a>
        </div>
    </div>

    <div class="container">
        <div class="seccion-header">
            <h2><i class="fas fa-chart-line"></i> Reportes de Ventas</h2>
            <div style="display: flex; gap: 1rem;">
                <select id="periodo" onchange="actualizarGrafico()" 
                        style="padding: 0.8rem; border: 1px solid #ddd; border-radius: 6px;">
                    <option value="hoy">Hoy</option>
                    <option value="semana">Esta semana</option>
                    <option value="mes" selected>Este mes</option>
                    <option value="anio">Este año</option>
                </select>
                <button onclick="exportarReporte()" class="btn-secundario">
                    <i class="fas fa-download"></i> Exportar
                </button>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 2rem;">
            <div style="background: white; padding: 1.5rem; border-radius: 10px; text-align: center;">
                <div style="width: 50px; height: 50px; background: #e8f5e9; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
                    <i class="fas fa-money-bill-wave" style="color: #4caf50; font-size: 1.5rem;"></i>
                </div>
                <p style="color: #666; margin-bottom: 0.5rem;">Ventas Totales</p>
                <p id="ventas-totales" style="font-size: 1.8rem; font-weight: bold; color: #4caf50;">S/. 0</p>
            </div>
            
            <div style="background: white; padding: 1.5rem; border-radius: 10px; text-align: center;">
                <div style="width: 50px; height: 50px; background: #fce4ec; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
                    <i class="fas fa-shopping-cart" style="color: #e91e63; font-size: 1.5rem;"></i>
                </div>
                <p style="color: #666; margin-bottom: 0.5rem;">Cantidad de Ventas</p>
                <p id="cantidad-ventas" style="font-size: 1.8rem; font-weight: bold; color: #e91e63;">0</p>
            </div>
            
            <div style="background: white; padding: 1.5rem; border-radius: 10px; text-align: center;">
                <div style="width: 50px; height: 50px; background: #fff3e0; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
                    <i class="fas fa-box" style="color: #ff9800; font-size: 1.5rem;"></i>
                </div>
                <p style="color: #666; margin-bottom: 0.5rem;">Productos Vendidos</p>
                <p id="productos-vendidos" style="font-size: 1.8rem; font-weight: bold; color: #ff9800;">0</p>
            </div>
            
            <div style="background: white; padding: 1.5rem; border-radius: 10px; text-align: center;">
                <div style="width: 50px; height: 50px; background: #e3f2fd; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
                    <i class="fas fa-user" style="color: #2196f3; font-size: 1.5rem;"></i>
                </div>
                <p style="color: #666; margin-bottom: 0.5rem;">Clientes</p>
                <p id="total-clientes" style="font-size: 1.8rem; font-weight: bold; color: #2196f3;">0</p>
            </div>
        </div>

        <div style="background: white; padding: 1.5rem; border-radius: 10px; margin-bottom: 2rem;">
            <h3 style="color: #e91e63; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
                <i class="fas fa-chart-bar"></i> Gráfico de Ventas
            </h3>
            <div style="position: relative; height: 300px;">
                <canvas id="grafico-ventas"></canvas>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr; gap: 1.5rem;">
            <div style="background: white; padding: 1.5rem; border-radius: 10px;">
                <h3 style="color: #e91e63; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
                    <i class="fas fa-star"></i> Productos Más Vendidos
                </h3>
                <div id="top-productos" style="display: grid; gap: 0.8rem;">
                    <!-- Productos más vendidos se cargarán aquí -->
                </div>
            </div>
            
            <div style="background: white; padding: 1.5rem; border-radius: 10px;">
                <h3 style="color: #e91e63; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
                    <i class="fas fa-history"></i> Últimas Ventas
                </h3>
                <div id="ultimas-ventas" style="max-height: 300px; overflow-y: auto;">
                    <!-- Últimas ventas se cargarán aquí -->
                </div>
            </div>
        </div>
    </div>

    <div id="notificaciones"></div>

    <script src="js/main.js"></script>
    <script src="js/reportes.js"></script>
</body>
</html>
