<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jessica Boutique | Agregar Producto</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/agregar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navbar -->
    <div class="navbar">
        <div class="logo">
            <i class="fas fa-store"></i>
            <h1>Jessica Boutique</h1>
            <span class="subtitle">Sistema de Gestión</span>
        </div>
        <div class="nav-buttons">
            <a href="index.html" class="nav-btn">
                <i class="fas fa-home"></i> Inicio
            </a>
            <a href="inventario.html" class="nav-btn">
                <i class="fas fa-boxes"></i> Inventario
            </a>
            <a href="agregar-producto.html" class="nav-btn active">
                <i class="fas fa-plus-circle"></i> Agregar
            </a>
            <a href="ventas.html" class="nav-btn">
                <i class="fas fa-cash-register"></i> Ventas
            </a>
            <a href="reportes.html" class="nav-btn">
                <i class="fas fa-chart-bar"></i> Reportes
            </a>
            <a href="gestion.html" class="nav-btn">
                <i class="fas fa-cog"></i> Gestión
            </a>
        </div>
    </div>

    <div class="container">
        <div class="seccion-header">
            <h2><i class="fas fa-plus-circle"></i> Registrar Nuevo Producto</h2>
            <button class="btn-secundario" onclick="location.href='inventario.html'">
                <i class="fas fa-arrow-left"></i> Volver al Inventario
            </button>
        </div>

        <div class="formulario-contenedor">
            <form id="form-agregar-producto" onsubmit="agregarProducto(event)">
                <div class="grupo-formulario">
                    <label for="nombre-producto">
                        <i class="fas fa-tag"></i> Nombre del Producto
                    </label>
                    <input type="text" id="nombre-producto" required placeholder="Ej: Vestido Floral" 
                           oninput="actualizarVistaPrevia()">
                </div>

                <div class="grupo-doble">
                    <div class="grupo-formulario">
                        <label for="categoria-producto">
                            <i class="fas fa-folder"></i> Categoría
                        </label>
                        <select id="categoria-producto" required onchange="actualizarVistaPrevia()">
                            <option value="">Seleccionar categoría</option>
                        </select>
                    </div>
                    <div class="grupo-formulario">
                        <label for="marca-producto">
                            <i class="fas fa-trademark"></i> Marca
                        </label>
                        <input type="text" id="marca-producto" required placeholder="Ej: Jessica Boutique" 
                               oninput="actualizarVistaPrevia()">
                    </div>
                </div>

                <div class="grupo-doble">
                    <div class="grupo-formulario">
                        <label for="precio-compra">
                            <i class="fas fa-shopping-cart"></i> Precio de Compra
                        </label>
                        <input type="number" id="precio-compra" required min="0" step="0.01" 
                               placeholder="S/. 0.00" oninput="actualizarVistaPrevia()">
                    </div>
                    <div class="grupo-formulario">
                        <label for="precio-venta">
                            <i class="fas fa-tag"></i> Precio de Venta
                        </label>
                        <input type="number" id="precio-venta" required min="0" step="0.01" 
                               placeholder="S/. 0.00" oninput="actualizarVistaPrevia()">
                    </div>
                </div>

                <div class="grupo-formulario">
                    <label><i class="fas fa-layer-group"></i> Combinaciones Talla-Color-Cantidad</label>
                    <div id="combinaciones-container">
                        <div class="combinacion-item">
                            <select class="combinacion-talla" required onchange="actualizarVistaPrevia()">
                                <option value="">Seleccionar talla</option>
                                <option value="XS">XS</option>
                                <option value="S">S</option>
                                <option value="M">M</option>
                                <option value="L">L</option>
                                <option value="XL">XL</option>
                                <option value="Única">Única</option>
                            </select>
                            <select class="combinacion-color" required onchange="actualizarVistaPrevia()">
                                <option value="">Seleccionar color</option>
                            </select>
                            <input type="number" class="combinacion-cantidad" required min="0" 
                                   placeholder="Cantidad" oninput="actualizarVistaPrevia()">
                            <button type="button" class="btn-eliminar-combinacion" onclick="eliminarCombinacion(this)">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>
                    <button type="button" class="btn-secundario" onclick="agregarCombinacion()">
                        <i class="fas fa-plus"></i> Agregar Combinación
                    </button>
                </div>

                <div class="botones-formulario">
                    <button type="reset" class="btn-secundario" onclick="limpiarFormulario()">
                        <i class="fas fa-times"></i> Limpiar
                    </button>
                    <button type="submit" class="btn-principal">
                        <i class="fas fa-save"></i> Guardar Producto
                    </button>
                </div>
            </form>

            <div class="vista-previa">
                <h3><i class="fas fa-eye"></i> Vista Previa</h3>
                <div class="producto-preview">
                    <div class="preview-header">
                        <span id="preview-nombre">Nombre del Producto</span>
                        <span id="preview-categoria" class="badge">Categoría</span>
                    </div>
                    <div class="preview-detalles">
                        <div class="detalle">
                            <span>Marca:</span>
                            <span id="preview-marca">-</span>
                        </div>
                        <div class="detalle">
                            <span>Precio Compra:</span>
                            <span id="preview-precio-compra">S/. 0.00</span>
                        </div>
                        <div class="detalle">
                            <span>Precio Venta:</span>
                            <span id="preview-precio-venta">S/. 0.00</span>
                        </div>
                        <div class="detalle">
                            <span>Ganancia por unidad:</span>
                            <span id="preview-ganancia">S/. 0.00 (0%)</span>
                        </div>
                        <div id="preview-combinaciones"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Notificaciones -->
    <div id="notificaciones" class="notificaciones"></div>

    <script src="js/main.js"></script>
    <script src="js/agregar.js"></script>
</body>
</html>
